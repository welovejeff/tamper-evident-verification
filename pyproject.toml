[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tamper-signal"
version = "2.1.0"
description = "Tamper Signal: signed receipts at every pipeline stage, with verifiable continuity and the exact broken link when there isn't."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = [
    "tamper-evident",
    "data-integrity",
    "data-provenance",
    "provenance",
    "ed25519",
    "signed-receipts",
    "data-pipelines",
    "hash-chain",
    "verification",
    "pandas",
    "vibe-coding",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "openpyxl>=3.1",
    "cryptography>=42.0",
]

[project.optional-dependencies]
anchor = ["sigstore>=4,<5"]
# The live-source watcher (receipts watch). Kept out of the base install so a
# non-watcher user still gets just openpyxl + cryptography. httpx for the
# SSRF-hardened fetch, feedparser + defusedxml for safe RSS/Atom parsing.
watch = ["httpx>=0.27", "feedparser>=6.0", "defusedxml>=0.7"]
dev = ["pytest>=8.0", "pandas>=2.0", "flask>=3.0", "fastapi>=0.110", "httpx>=0.27", "feedparser>=6.0", "defusedxml>=0.7", "sigstore>=4,<5"]
# Brand imagery tooling for scripts/gen_images.py (fal.ai Recraft V3). Not needed
# to build or test the library; install with `pip install -e ".[images]"`.
images = ["fal-client>=0.4", "pillow>=10"]

[project.urls]
Homepage = "https://tampersignal.com/"
Documentation = "https://tampersignal.com/docs/"
Repository = "https://github.com/welovejeff/tamper-evident-verification"
Issues = "https://github.com/welovejeff/tamper-evident-verification/issues"
Changelog = "https://github.com/welovejeff/tamper-evident-verification/blob/main/CHANGELOG.md"

[project.scripts]
# `tamper-signal` is the primary command on both stacks as of 2.0. `receipts`
# is kept as a deprecated Python-only alias (it prints a deprecation notice)
# and is scheduled for removal in 3.0.
tamper-signal = "tamper_signal.cli:main"
receipts = "tamper_signal.cli:main"

# find (not a fixed list) so subpackages such as tamper_signal._demo ship in
# the wheel; `tamper-signal demo` imports its sample data from there.
[tool.setuptools.packages.find]
include = ["tamper_signal*"]

[tool.setuptools.package-data]
tamper_signal = ["static/*.js"]
