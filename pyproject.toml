[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tamper-signal"
version = "1.7.1"
description = "Tamper Signal: signed receipts at every pipeline stage, with verifiable continuity and the exact broken link when there isn't."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "cryptography>=42.0",
]

[project.optional-dependencies]
anchor = ["sigstore>=4,<5"]
dev = ["pytest>=8.0", "pandas>=2.0", "flask>=3.0", "fastapi>=0.110", "httpx>=0.27", "sigstore>=4,<5"]
# Brand imagery tooling for scripts/gen_images.py (fal.ai Recraft V3). Not needed
# to build or test the library; install with `pip install -e ".[images]"`.
images = ["fal-client>=0.4", "pillow>=10"]

[project.urls]
Homepage = "https://tampersignal.com/"
Repository = "https://github.com/welovejeff/tamper-evident-verification"

[project.scripts]
receipts = "tamper_signal.cli:main"

[tool.setuptools]
packages = ["tamper_signal"]

[tool.setuptools.package-data]
tamper_signal = ["static/*.js"]
