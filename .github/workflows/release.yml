# Release on version tags (v1.2.0): run both test suites, then publish the
# Python package to PyPI and the JavaScript package to npm.
#
# One-time setup, done in each registry's web UI:
# - PyPI: add a "trusted publisher" for this repo/workflow on the
#   tamper-signal project (no token needed; uses the id-token permission).
# - npm: after the first manual `npm publish`, either configure trusted
#   publishing for this repo/workflow on the package settings, or create a
#   granular automation token and save it as the NPM_TOKEN repo secret.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: npm test

  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Skip cleanly (instead of failing the release) when the version is
      # already on npm (e.g. published manually) or no token is configured.
      - name: Decide whether to publish
        id: gate
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "no NPM_TOKEN secret; skipping npm publish"
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif npm view "tamper-signal@$VERSION" version >/dev/null 2>&1; then
            echo "tamper-signal@$VERSION already on npm; skipping"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.go == 'true'
        run: npm publish --provenance --access public
