<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 1200px; height: 630px; background: #0b0f14;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px;
    font-family: ui-monospace, 'SF Mono', Menlo, Monaco, 'Cascadia Code', monospace; }
  .lockup { display: flex; align-items: stretch; gap: 40px; }
  .rail { display: flex; flex-direction: column; justify-content: space-between; padding: 13px 0; }
  .rail i { width: 24px; height: 24px; border-radius: 50%; display: block; box-sizing: border-box; }
  .rail .r { background: rgba(248, 113, 113, 0.22); border: 2px solid rgba(248, 113, 113, 0.25); }
  .rail .y { background: rgba(251, 191, 36, 0.22); border: 2px solid rgba(251, 191, 36, 0.25); }
  .rail .g { background: #34d399; box-shadow: 0 0 18px 0 rgba(52, 211, 153, 0.8); }
  .words { font-size: 64px; line-height: 1.25; letter-spacing: 15px; color: #e5e7eb; white-space: nowrap; }
  .tagline { font-size: 28px; letter-spacing: 1px; color: #34d399;
    text-shadow: 0 0 18px rgba(52, 211, 153, 0.35); }
</style>
</head>
<body>
  <div class="lockup">
    <span class="rail"><i class="r"></i><i class="y"></i><i class="g"></i></span>
    <span class="words">TAMPER<br>SIGNAL</span>
  </div>
  <div class="tagline">The light is green, the data is clean.</div>
</body>
</html>
